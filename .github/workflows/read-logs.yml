name: Read Cloud Run logs

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Extra log filter (substring of textPayload)"
        required: false
        default: "viewer-state"
      freshness:
        description: "How far back to read (e.g. 2h, 1d)"
        required: false
        default: "3h"

env:
  SERVICE_NAME: trb-mcp-server-api
  REGION: europe-west1

jobs:
  read-logs:
    name: Read logs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Read logs
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.SERVICE_NAME }} AND textPayload:\"${{ inputs.filter }}\"" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --freshness "${{ inputs.freshness }}" \
            --limit 100 \
            --order desc \
            --format "value(timestamp, textPayload)"
